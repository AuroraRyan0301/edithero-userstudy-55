<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>EditHero User Study</title>
<style>
html,body{min-width:1920px}
body{font-family:Arial,sans-serif;margin:16px;color:#111;line-height:1.4}
h1{font-size:22px}
.muted{color:#555;font-size:13px}
.card{border:1px solid #ddd;border-radius:8px;padding:12px;margin:12px 0;max-width:1100px}
label.opt{border:1px solid #ccc;border-radius:4px;padding:2px 8px;cursor:pointer;font-size:12px;line-height:1.25;white-space:nowrap}
.progress{background:#fff;padding:8px 0;border-bottom:1px solid #eee}
button{font-size:16px;padding:8px 16px;margin-right:8px;cursor:pointer}
.err{color:#b00020}
.scroll{overflow-x:visible;max-width:none;width:max-content;border:1px solid #ddd;background:#fff}
table.chain{border-collapse:separate;border-spacing:0;table-layout:fixed}
table.chain th, table.chain td{border-right:1px solid #e5e5e5;border-bottom:1px solid #e5e5e5;padding:6px;vertical-align:top;background:#fff}
table.chain thead th{background:#fafafa;font-weight:600;position:static}
table.chain th.lab, table.chain td.lab{position:sticky;left:0;z-index:1;width:64px;min-width:64px;max-width:64px;background:#f3f3f3;text-align:center;font-size:14px;font-weight:700;border-right:2px solid #ccc}
table.chain thead th.lab{background:#eee}
table.chain thead th.col{width:168px;min-width:168px;max-width:168px;font-size:11px;line-height:1.35;text-align:left;white-space:normal;word-wrap:break-word;overflow:visible}
table.chain thead th.col .tn{display:block;color:#444;font-size:11px;margin-bottom:4px}
table.chain thead th.col .en{display:block;font-weight:600;margin-bottom:3px}
table.chain thead th.col .zh{display:block;color:#555;font-weight:400}
.t-tgt{background:#c8efc0;color:#146214;border-radius:2px;padding:0 1px}
.t-src{background:#ffd4d4;color:#9b1c1c;border-radius:2px;padding:0 1px}
.t-pos{background:#cfe4ff;color:#084298;border-radius:2px;padding:0 1px}
.legend{font-size:12px;margin:6px 0 8px;line-height:1.8}
.legend b{font-weight:600;margin-right:4px}
table.chain td.cell{width:168px;min-width:168px;max-width:168px;text-align:center;padding:6px;overflow:visible}
table.chain td.cell img{width:156px;height:156px;object-fit:contain;object-position:center;background:#fff;display:block;margin:0 auto}
table.chain tr.gt td.cell{background:#f7fbff}
table.chain tr.gt th.lab{background:#dceaf7}
table.chain th.sc, table.chain td.sc{position:sticky;right:0;z-index:2;width:118px;min-width:118px;max-width:118px;background:#fff6eb;vertical-align:middle;text-align:center;box-shadow:-3px 0 5px rgba(0,0,0,.06)}
table.chain thead th.sc{font-size:12px;line-height:1.3;position:sticky}
table.chain tr.gt td.sc{background:#eef3f8;color:#888}
table.chain th.sc.cc, table.chain td.sc.cc{background:#eef7ee}
.scorebox{display:flex;flex-direction:column;align-items:center;gap:4px}
.sc.if{right:130px} table.chain thead th.sc.if{right:130px}
</style>
</head>
<body>
<div id="app"></div>
<script>
var IMAGE_BASE = 'https://auroraryan0301.github.io/edithero-userstudy-55/study_pair20_all55/assets/';
var IMAGE_FALLBACK = 'https://auroraryan0301.github.io/edithero-userstudy-55/study_pair20_all55/assets/';
var PAIR_BANK = {"protocol": "edithero_original_pair20_all55_IFCC_equalpipe_v1", "pairs_per_rater": 20, "items": []};
var PAIRS_PER_PERSON = PAIR_BANK.pairs_per_rater;
var TRAD = ["v01", "v02", "v03", "v04"];
var state = {page:'intro', i:0, manifest:null, items:[], answers:{}, bg:{}};

function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function sample(arr,k){ return shuffle(arr).slice(0,k); }
function el(s){ var d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
var POS_ZH=['逆时针一侧','顺时针一侧','另一侧','旁边','左侧','右侧','左边','右边','上方','下方','前面','后面','顶上','底下','之间','中间','外侧','内侧','前方','后方','左前','右前','左后','右后','顶面','底面','一侧','正前方','靠后','朝外','朝前','朝后','向上','向下','向后','向左','向右','居中'];
var POS_EN=['to the other side of','the other side of','the other side','next to','in front of','on top of','attached to','to the left of','to the right of','left of','right of','beside','between','above','below','behind','under','around'];
function noOverlap(spans,i,j){
  for(var k=0;k<spans.length;k++){ var a=spans[k][0],b=spans[k][1]; if(!(j<=a||i>=b)) return false; }
  return true;
}
function addSpan(spans,i,j,cls){ if(j>i && noOverlap(spans,i,j)) spans.push([i,j,cls]); }
function eachRe(re,s,fn){ re.lastIndex=0; var m; while((m=re.exec(s))) fn(m); }
function posHits(s, keys, ignoreCase){
  var hits=[], i=0, src=ignoreCase?s.toLowerCase():s;
  while(i<src.length){
    var hit=null;
    for(var k=0;k<keys.length;k++){ var key=ignoreCase?keys[k].toLowerCase():keys[k]; if(src.indexOf(key,i)===i){ hit=keys[k]; break; } }
    if(hit){ hits.push([i,i+hit.length]); i+=hit.length; } else i++;
  }
  return hits;
}
function mergePos(s, spans, keys, ignoreCase){
  var hits=posHits(s,keys,ignoreCase), neu=[], i, p, q, a, b, cls, cur;
  for(i=0;i<spans.length;i++){
    a=spans[i][0]; b=spans[i][1]; cls=spans[i][2]; cur=a;
    for(var h=0;h<hits.length;h++){
      p=hits[h][0]; q=hits[h][1];
      if(p>=b||q<=a) continue;
      if(p>cur) neu.push([cur,p,cls]);
      cur=Math.max(cur,q);
    }
    if(cur<b) neu.push([cur,b,cls]);
  }
  for(i=0;i<hits.length;i++) neu.push([hits[i][0],hits[i][1],'pos']);
  neu=neu.filter(function(x){ return x[1]>x[0]; });
  neu.sort(function(x,y){ return x[0]-y[0] || (x[2]==='pos'?0:1)-(y[2]==='pos'?0:1) || (y[1]-y[0])-(x[1]-x[0]); });
  var out=[];
  for(i=0;i<neu.length;i++) if(noOverlap(out,neu[i][0],neu[i][1])) out.push(neu[i]);
  return out;
}
function paint(s, spans){
  spans=spans.slice().sort(function(a,b){ return a[0]-b[0]; });
  var o='', last=0;
  for(var k=0;k<spans.length;k++){
    var i=spans[k][0], j=spans[k][1], cls=spans[k][2];
    if(i<last) continue;
    o+=el(s.slice(last,i))+'<span class="t-'+cls+'">'+el(s.slice(i,j))+'</span>';
    last=j;
  }
  return o+el(s.slice(last));
}
function colorZh(s){
  if(!s) return '';
  var spans=[], VA='添加|附加|连接|再接|放置|贴装|摆|挂|立|放|接|加', L='旁|上|下|左边|右边|左侧|右侧|前面|后面|顶上|旁边|之间|前方|后方|顶面|底面|前|后|外|里|正前方';
  eachRe(new RegExp('在([^。]+?)和([^。]+?)之间(?:'+VA+')([^。]+?)(?=。|$)','g'), s, function(m){ addSpan(spans,m.index+m[0].indexOf(m[1]), m.index+m[0].indexOf(m[1])+m[1].length,'src'); addSpan(spans,m.index+m[0].indexOf(m[2]), m.index+m[0].indexOf(m[2])+m[2].length,'src'); addSpan(spans,m.index+m[0].lastIndexOf(m[3]), m.index+m[0].lastIndexOf(m[3])+m[3].length,'tgt'); });
  eachRe(new RegExp('在([^。]+?)的('+L+'|另一侧)(?:'+VA+')([^。]+?)(?=。|$)','g'), s, function(m){
    addSpan(spans, m.index+1, m.index+1+m[1].length, 'src');
    addSpan(spans, m.index+1+m[1].length+1, m.index+1+m[1].length+1+m[2].length, 'pos');
    addSpan(spans, m.index+m[0].length-m[3].length, m.index+m[0].length, 'tgt');
  });
  eachRe(new RegExp('在([^。]+?)('+L+')(?:'+VA+')([^。]+?)(?=。|$)','g'), s, function(m){
    addSpan(spans, m.index+1, m.index+1+m[1].length, 'src');
    addSpan(spans, m.index+1+m[1].length, m.index+1+m[1].length+m[2].length, 'pos');
    addSpan(spans, m.index+m[0].length-m[3].length, m.index+m[0].length, 'tgt');
  });
  eachRe(new RegExp('在([^。]+?)(?:'+VA+')([^。]+?)(?=。|$)','g'), s, function(m){
    addSpan(spans, m.index+1, m.index+1+m[1].length, 'src');
    addSpan(spans, m.index+m[0].length-m[2].length, m.index+m[0].length, 'tgt');
  });
  eachRe(/沿([^。]+?)(?:添加|加)([^。]+?)(?=。|，|$)/g, s, function(m){
    addSpan(spans, m.index+1, m.index+1+m[1].length, 'pos');
    addSpan(spans, m.index+m[0].length-m[2].length, m.index+m[0].length, 'tgt');
  });
  eachRe(/(?:把|将)([^。]+?)(?:换成|改成|改为|替换为|替换成)([^。]+?)(?=。|$)/g, s, function(m){
    addSpan(spans, m.index+1, m.index+1+m[1].length, 'src');
    addSpan(spans, m.index+m[0].length-m[2].length, m.index+m[0].length, 'tgt');
  });
  eachRe(/(?:把|将)([^。]+?)(?:直立)?(?:重新)?(?:装回|装到|装在|戴在|放在|贴在)([^。]+?)(?=。|$)/g, s, function(m){
    addSpan(spans, m.index+1, m.index+1+m[1].length, 'tgt');
    addSpan(spans, m.index+m[0].length-m[2].length, m.index+m[0].length, 'src');
  });
  eachRe(/(?:把|将)([^。]+?)从([^。]+?)(上|中|里|旁)(?:拆下|移除|取下|去掉|摘掉)([^。]*)(?=。|$)/g, s, function(m){
    addSpan(spans, m.index+1, m.index+1+m[1].length, 'src');
    addSpan(spans, m.index+1+m[1].length+1, m.index+1+m[1].length+1+m[2].length, 'pos');
  });
  eachRe(/(?:把|将)([^。]+?)(?:移除|摘掉|拆下)(?=。|$)/g, s, function(m){
    addSpan(spans, m.index+1, m.index+1+m[1].length, 'src');
  });
  eachRe(/从([^。]+?)(上|中|里|旁)(?:拆下|移除|取下|去掉|摘掉)([^。]+?)(?=。|$)/g, s, function(m){
    addSpan(spans, m.index+1, m.index+1+m[1].length, 'pos');
    addSpan(spans, m.index+m[0].length-m[3].length, m.index+m[0].length, 'src');
  });
  eachRe(/(?:移除|拆下|取下|去掉|取出|摘掉)([^。]+?)(?=。|$)/g, s, function(m){
    addSpan(spans, m.index+m[0].length-m[1].length, m.index+m[0].length, 'src');
  });
  return paint(s, mergePos(s, spans, POS_ZH, false));
}
function colorEn(s){
  if(!s) return '';
  var spans=[];
  eachRe(/(?:Replace|Change|Swap)\s+([^.]{2,80}?)\s+(?:with|to|for)\s+([^.]{2,120}?)(?=\.|$)/gi, s, function(m){
    addSpan(spans, m.index+m[0].indexOf(m[1]), m.index+m[0].indexOf(m[1])+m[1].length, 'src');
    addSpan(spans, m.index+m[0].length-m[2].length, m.index+m[0].length, 'tgt');
  });
  eachRe(/(?:Remove|Detach|Take off|Delete)\s+([^.]{2,120}?)(?=\.|$)/gi, s, function(m){
    addSpan(spans, m.index+m[0].length-m[1].length, m.index+m[0].length, 'src');
  });
  eachRe(/(?:Add|Attach|Place|Put)\s+([^.]{2,100}?)\s+(to the other side of|on top of|next to|beside|above|below|behind|under|around|onto)\s+([^.]{2,100}?)(?=\.|$)/gi, s, function(m){
    addSpan(spans, m.index+m[0].indexOf(m[1]), m.index+m[0].indexOf(m[1])+m[1].length, 'tgt');
    addSpan(spans, m.index+m[0].indexOf(m[2], m[0].indexOf(m[1])+m[1].length), m.index+m[0].indexOf(m[2], m[0].indexOf(m[1])+m[1].length)+m[2].length, 'pos');
    addSpan(spans, m.index+m[0].length-m[3].length, m.index+m[0].length, 'src');
  });
  eachRe(/(?:Add|Attach|Place)\s+([^.]{2,100}?)\s+between\s+([^.]{2,80}?)\s+and\s+([^.]{2,80}?)(?=\.|$)/gi, s, function(m){
    addSpan(spans, m.index+m[0].indexOf(m[1]), m.index+m[0].indexOf(m[1])+m[1].length, 'tgt');
    addSpan(spans, m.index+m[0].length-m[3].length-5-m[2].length, m.index+m[0].length-m[3].length-5, 'src');
    addSpan(spans, m.index+m[0].length-m[3].length, m.index+m[0].length, 'src');
  });
  eachRe(/(?:Add|Mount|Stand|Place)\s+([^.]{2,100}?)\s+(?:at|near|on)\s+([^.]{2,100}?)(?=\.|$)/gi, s, function(m){
    addSpan(spans, m.index+m[0].indexOf(m[1]), m.index+m[0].indexOf(m[1])+m[1].length, 'tgt');
    addSpan(spans, m.index+m[0].length-m[2].length, m.index+m[0].length, 'src');
  });
  eachRe(/Give\s+([^.]{2,80}?)\s+(?:a|an)\s+([^.]{2,120}?)(?=,|\.| with| keeping| preserving|$)/gi, s, function(m){
    addSpan(spans, m.index+5, m.index+5+m[1].length, 'src');
    addSpan(spans, m.index+m[0].length-m[2].length, m.index+m[0].length, 'tgt');
  });
  return paint(s, mergePos(s, spans, POS_EN, true));
}
function legendHtml(){
  return '<p class="legend"><b>Color / 配色</b> <span class="t-tgt">target / 修改目标</span> <span class="t-src">edited object / 被修改</span> <span class="t-pos">position / 位置</span></p>';
}
function groupOf(m){ return TRAD.indexOf(m)>=0?'traditional':'llm'; }
function assignPair(p, ch){
  var pick=shuffle(p.methods);
  var shown=[{slot:'A', method:pick[0], group:groupOf(pick[0])},{slot:'B', method:pick[1], group:groupOf(pick[1])}];
  return {pair:p, chain:ch, shown:shown};
}
function img(folder, name){ return IMAGE_BASE + folder + '/' + name + '.jpg'; }
function pad2(n){ return (n<10?'0':'')+n; }
function cell(src){
  return '<td class="cell"><img referrerpolicy="no-referrer" loading="lazy" src="'+src+'" alt="" onerror="imgFail(this)"></td>';
}
function imgFail(el){
  var src=el.getAttribute('src')||'';
  if (!el.dataset.fb && src.indexOf(IMAGE_BASE)===0){
    el.dataset.fb='1';
    el.src = IMAGE_FALLBACK + src.slice(IMAGE_BASE.length);
    return;
  }
  el.style.background='#eee';
}
function scoreCell(pairId, slot, metric){
 var key=slot+'_'+metric, a=state.answers[pairId]||{};
 var h='<td class="sc '+(metric==='IF'?'if':'cc')+'"><div class="scorebox">';
 for(var v=1;v<=5;v++){
  var checked=a[key]==v?' checked':'';
  h+='<label class="opt"><input type="radio" name="sc_'+key+'" value="'+v+'" onchange="setAns(\''+pairId+'\',\''+key+'\','+v+')"'+checked+'> '+v+'</label>';
 }
 return h+'</div></td>';
}
function metricCopy(metric){
  if(metric==='BOTH')return {head:'IF + CC',hint:'看完整序列后，同时为 A、B 的指令跟随 IF 与未改区域保持 CC 打 1–5 分。IF：1 未完成修改，5 完全完成；CC：1 未改区域严重变化，5 完整保持。CC请对照该方法自身上一轮；可以同分。 / Rate BOTH IF and CC for A and B; compare preservation against each method’s own previous state.'};
  if(metric==='IF'){
    return {head:'IF<br>指令跟随',
      hint:'本页只评指令跟随 / closeness to target。看完整序列后给 A、B 各打 1–5：1 完全没有 / not at all → 5 完全做到 / fully。'};
  }
  return {head:'CC<br>未改区域保持',
    hint:'本页只评不该改区域的保持。看完整序列后给 A、B 各打 1–5：1 严重被改 / heavily altered → 5 完全保持 / fully preserved。'};
}

function render(){
  var root=document.getElementById('app');
  if(state.page==='intro'){
    root.innerHTML='<h1>EditHero User Study / EditHero 用户评测</h1>'
      +'<p>You will rate <b>'+PAIRS_PER_PERSON+' pairs</b>. Each page shows the full GT chain and two unnamed editors <b>A / B</b>.</p>'
      +'<p>每人评 <strong>'+PAIRS_PER_PERSON+' 对</strong>。每页是一条完整 GT 链 + 两个匿名编辑器 A/B，看完整序列后打分。</p>'
      +'<p>Scale is 5 points. IF: 1 not at all / 完全没有 → 5 fully / 完全做到. CC: 1 heavily altered / 严重被改 → 5 fully preserved / 完全保持. Each page asks BOTH IF and CC for A and B.</p>'
      +'<p>五档 1–5。每页同时评价 A、B 的指令跟随 IF 和未改区域保持 CC。</p>'
      +'<p class="muted">Method names hidden. 方法名隐藏。Anonymous, ICLR 2027 rebuttal only.</p>'
      +legendHtml()
      +'<div class="card"><p><label><input type="checkbox" id="consent"> I am 18+ and agree / 我已满 18 岁并同意参加</label></p>'
      +'<p>3D / graphics experience</p><select id="exp3d"><option value="">Select</option><option>None</option><option>Casual</option><option>Student</option><option>Professional</option></select>'
      +'<p>AI image or 3D tool experience</p><select id="expai"><option value="">Select</option><option>None</option><option>Some</option><option>Regular user</option></select>'
      +'<p class="err" id="introErr"></p><p><button onclick="start()">Start / 开始</button></p></div>';
    return;
  }
  if(state.page==='done'){
    root.innerHTML='<h1>Thank you / 谢谢</h1><p>'+el(state.doneMsg||'Submitted.')+'</p>';
    return;
  }
  var item=state.items[state.i], ch=item.chain, p=item.pair, mc=metricCopy(p.metric);
  var head='<tr><th class="lab"></th><th class="col"><span class="tn">T0</span><span class="en">Source</span><span class="zh">初始</span></th>';
  ch.turns.forEach(function(t){
    head+='<th class="col" title="'+el(t.instruction)+'"><span class="tn">T'+t.k+' / '+ch.nTurns+'</span><span class="en">'+colorEn(t.instruction)+'</span><span class="zh">'+colorZh(t.instruction_zh)+'</span></th>';
  });
  head+='<th class="sc if">IF<br>指令跟随</th><th class="sc cc">CC<br>未改区域保持</th></tr>';
  var gt='<tr class="gt"><th class="lab">GT</th>'+cell(img(ch.folder,'gt_00'));
  ch.turns.forEach(function(t){ gt+=cell(img(ch.folder,'gt_'+pad2(t.k))); });
  gt+='<td class="sc if"></td><td class="sc cc"></td></tr>';
  var body='';
  item.shown.forEach(function(s){
    var row='<tr><th class="lab">'+s.slot+'</th>'+cell(img(ch.folder,'gt_00'));
    ch.turns.forEach(function(t){ row+=cell(img(ch.folder, s.method+'_'+pad2(t.k))); });
    row+=scoreCell(p.id,s.slot,'IF')+scoreCell(p.id,s.slot,'CC');
    body+=row+'</tr>';
  });
  var table='<div class="scroll"><table class="chain"><thead>'+head+'</thead><tbody>'+gt+body+'</tbody></table></div>';
  root.innerHTML='<div class="progress">Pair '+(state.i+1)+' / '+state.items.length+' &nbsp; '+p.metric+' &nbsp; '+ch.style+' &nbsp; '+ch.nTurns+' turns — scores stay on the right / 右侧打分钉住</div>'
    +legendHtml()
    +'<p class="muted">'+mc.hint+' 同一列是同一轮。</p>'
    +table
    +'<p class="err" id="qErr"></p>'
    +'<p><button onclick="prevQ()">Back</button><button onclick="nextQ()">Next</button></p>';
}
function setAns(id,key,v){ if(!state.answers[id]) state.answers[id]={}; state.answers[id][key]=v; }
function beginWith(pairs){
  var map={};
  state.manifest.chains.forEach(function(c){ map[c.id]=c; });
  var items=[];
  pairs.forEach(function(p){
    var ch=map[p.chain];
    if(ch) items.push(assignPair(p, ch));
  });
  if(items.length!==20)throw new Error('Expected 20 assigned pairs');
  state.items=shuffle(items);
  state.page='q'; state.i=0; render(); window.scrollTo(0,0);
}
function start(){
 if(!document.getElementById('consent').checked){document.getElementById('introErr').textContent='Please consent';return;}
 var e3=document.getElementById('exp3d').value,ea=document.getElementById('expai').value;
 if(!e3||!ea){document.getElementById('introErr').textContent='Please fill background';return;}
 state.bg={exp3d:e3,expai:ea};document.getElementById('introErr').textContent='Assigning 20 pairs / 正在分配20题…';
 var token=null;try{token=localStorage.getItem('edithero_pair20_token');}catch(e){}
 google.script.run.withSuccessHandler(function(r){
  if(r.done){state.page='done';state.doneMsg=r.message;render();return;}
  state.token=r.token;try{localStorage.setItem('edithero_pair20_token',r.token);}catch(e){}
  beginWith(r.items);
 }).withFailureHandler(function(e){document.getElementById('introErr').textContent=e.message||String(e);}).pickPairs([],token);
}
